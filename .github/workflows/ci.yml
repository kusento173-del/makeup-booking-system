name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  APP_TIME_ZONE: Asia/Shanghai
  DATABASE_URL: postgresql://makeup:makeup_local@localhost:5432/makeup_booking?schema=public
  POSTGRES_DB: makeup_booking
  POSTGRES_PASSWORD: makeup_local
  POSTGRES_USER: makeup
  REDIS_PASSWORD: makeup_local
  REDIS_URL: redis://:makeup_local@localhost:6379
  TZ: Asia/Shanghai

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          run_install: false
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version-file: .node-version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security policy checks
        run: pnpm security:check

      - name: Start PostgreSQL and Redis
        run: pnpm infra:up

      - name: Validate and migrate empty database
        run: |
          pnpm db:validate
          pnpm db:migrate
          pnpm db:status
          pnpm db:check
          pnpm infra:check

      - name: Run project quality checks
        run: pnpm check

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end smoke tests
        run: pnpm e2e:test

      - name: Print infrastructure logs after failure
        if: failure()
        run: docker compose logs --no-color postgres redis

      - name: Stop infrastructure
        if: always()
        run: pnpm infra:down
